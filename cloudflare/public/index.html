<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Limp · PDV</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="shell"><aside><div class="brand"><img class="brand-logo" src="/assets/Logo%20stl%20circular%20nova%20IA.png" alt="STL Fragrâncias e Produtos"><div class="brand-text">star limp<small>FRAGRÂNCIAS E PRODUTOS</small></div></div><small>OPERAÇÃO</small><button class="nav active" data-view="dashboard">▦ Visão geral</button><button class="nav" data-view="sale">＋ Nova venda</button><small>GESTÃO</small><button class="nav" data-view="products">□ Produtos e preços</button><button class="nav" data-view="payables">▣ Contas a pagar</button><div class="side-note">Cloudflare Workers + D1<br><span>● Sistema online</span></div></aside><main><header><div><strong id="head-title">Painel operacional</strong><p>Atalhos para atender sem parar</p></div><span class="avatar">JL</span></header><div id="app"></div></main></div><template id="dashboard"><section class="page"><div class="welcome"><div><h1 id="greeting">Bom dia, Júlio.</h1><p>Tudo pronto para um atendimento rápido no balcão.</p></div><button class="primary" data-go="sale">+ Nova venda</button></div><section class="cards"><button class="action primary-card" data-go="sale"><b>⊕</b><strong>Nova venda</strong><small>Começar atendimento no PDV</small></button><button class="action" data-go="products"><b>□</b><strong>Produtos e preços</strong><small>Cadastro e alteração rápida</small></button><a class="action" href="#"><b>R$</b><strong>Receber pagamento</strong><small>Em breve nesta versão</small></a></section><section class="dashboard-grid"><article class="panel"><h2>Venda de balcão</h2><p class="text">Busque produtos por código ou descrição, escolha a forma de pagamento e imprima o pedido ou recibo ao concluir.</p><button class="success" data-go="sale">Iniciar nova venda</button></article><article class="panel"><h2>Resumo de hoje</h2><div class="metric"><span>Vendas do dia</span><strong id="today">R$ 0,00</strong></div><div class="metric"><span>Vendas da semana</span><strong id="week">R$ 0,00</strong></div><div class="metric warn"><span>Contas a receber</span><strong id="receivable">R$ 0,00</strong><small id="debtors"></small></div></article></section></section></template><template id="payables"><section class="page"><div class="welcome"><div><h1>Contas a pagar</h1><p>Importe boletos, acompanhe vencimentos e registre cada baixa.</p></div><button class="primary" id="new-payable">+ Importar boleto</button></div><section class="payable-metrics"><article class="panel"><span>Em aberto</span><strong id="payable-pending">R$ 0,00</strong><small id="payable-pending-count"></small></article><article class="panel"><span>Pagamentos no mês</span><strong id="payable-paid-month">R$ 0,00</strong><small id="payable-paid-count"></small></article></section><section class="panel table-panel"><table><thead><tr><th>Vencimento</th><th>Fornecedor / descrição</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody id="payable-rows"></tbody></table><p class="empty" id="empty-payables"></p></section></section></template><template id="products"><section class="page"><div class="welcome"><div><h1>Produtos e preços</h1><p>Cadastre, altere valores e acompanhe o estoque.</p></div><button class="primary" id="new-product">+ Novo produto</button></div><input id="product-search" class="search" placeholder="Buscar por produto ou código"><section class="panel table-panel"><table><thead><tr><th>Produto</th><th>Código</th><th>Estoque</th><th>Preço</th><th></th></tr></thead><tbody id="product-rows"></tbody></table><p class="empty" id="empty-products"></p></section></section></template><template id="sale"><section class="page"><div class="welcome"><div><h1>Nova venda</h1><p>Atendimento rápido de balcão.</p></div><button class="secondary" data-go="dashboard">← Painel</button></div><section class="sale-grid"><article class="panel"><h2>Produtos</h2><input id="sale-search" class="search" placeholder="Buscar produto"><div id="suggestions"></div><div class="quantity"><label>Quantidade <input id="quantity" type="number" min="1" value="1"></label><button class="primary" id="add-item">Adicionar</button></div><h2>Itens da venda</h2><div id="cart" class="cart empty">Nenhum produto adicionado.</div></article><aside class="panel total-panel"><span>Total da venda</span><strong id="sale-total">R$ 0,00</strong><label>Pagamento<select id="payment"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="debito">Débito</option><option value="credito">Crédito</option></select></label><button class="success" id="finish-sale">Finalizar venda</button><p class="print-note">Após concluir, você poderá imprimir o pedido ou recibo na Atomo.</p></aside></section></section></template><dialog id="payable-dialog"><form method="dialog"><div class="dialog-head"><h2>Importar boleto</h2><button>×</button></div><p class="text">Envie o PDF para preencher os campos automaticamente. Confira os dados antes de salvar.</p><label class="file-field">Arquivo PDF<input id="boleto-file" type="file" accept="application/pdf"><span id="boleto-file-name">Selecionar boleto em PDF</span></label><div class="form-grid"><label class="wide">Fornecedor / beneficiário<input id="p-supplier" placeholder="Nome do fornecedor"></label><label class="wide">Descrição<input id="p-description" value="Boleto importado"></label><label class="wide">Linha digitável<input id="p-line" inputmode="numeric" placeholder="Código de barras ou linha digitável"></label><label>Valor (R$)<input id="p-value" type="number" min="0.01" step="0.01" required></label><label>Vencimento<input id="p-due" type="date"></label></div><p class="print-note" id="pdf-status"></p><div class="dialog-actions"><button class="secondary">Cancelar</button><button class="primary" id="save-payable" value="default">Cadastrar conta</button></div></form></dialog><dialog id="settlement-dialog"><form method="dialog"><div class="dialog-head"><h2>Baixar conta</h2><button>×</button></div><p class="text" id="settlement-title"></p><div class="form-grid"><label>Banco / pagamento<select id="s-bank"><option value="">Selecionar</option><option>Caixa</option><option>Banco do Brasil</option><option>Bradesco</option><option>Itaú</option><option>Santander</option><option>Inter</option><option>Nubank</option><option>Pix</option><option>Dinheiro</option><option>Outro</option></select></label><label>Valor pago (R$)<input id="s-value" type="number" min="0.01" step="0.01" required></label><label>Data de pagamento<input id="s-date" type="date" required></label><label>Observação<input id="s-note" placeholder="Opcional"></label></div><div class="dialog-actions"><button class="secondary">Cancelar</button><button class="success" id="save-settlement" value="default">Confirmar baixa</button></div></form></dialog><dialog id="product-dialog"><form method="dialog"><div class="dialog-head"><h2 id="dialog-title">Novo produto</h2><button>×</button></div><div class="form-grid"><label>Código<input id="f-code"></label><label>Unidade<input id="f-unit" value="UN"></label><label class="wide">Descrição<input id="f-description" required></label><label>Preço<input id="f-price" type="number" min="0" step="0.01" required></label><label>Estoque<input id="f-stock" type="number" min="0" step="0.01" value="0"></label><label>Categoria<input id="f-category"></label><label>Situação<select id="f-status"><option>Ativo</option><option>Inativo</option></select></label></div><div class="dialog-actions"><button class="secondary">Cancelar</button><button class="primary" id="save-product" value="default">Salvar</button></div></form></dialog><dialog id="receipt-dialog"><form method="dialog" class="receipt-choice"><h2>Venda concluída</h2><p id="receipt-message"></p><button class="primary" id="print-receipt" value="default">Imprimir recibo térmico</button><button class="secondary" id="print-order" value="default">Abrir pedido completo</button><button class="link">Fechar</button></form></dialog><script src="/app.js"></script></body></html>
