<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Limp · PDV</title><link rel="stylesheet" href="/styles.css"></head>
<body><svg class="icon-sprite" aria-hidden="true"><symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2z"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3V10z"/><path d="M9 20v-7h6v7"/></symbol><symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M2 3h2l3 13h13l2-9H5"/></symbol><symbol id="i-sales" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M15 3v4h4M8 12h8M8 16h8"/></symbol><symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/></symbol><symbol id="i-box" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5 9-5zM3 7v10l9 5 9-5V7M12 12v10"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5zM14 3v5h5M8 13h8M8 17h8"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol></svg><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-symbol"><svg class="ui-icon"><use href="#i-spark"/></svg></span><span class="brand-text">STAR LIMP</span></div><button class="side-primary" data-go="sale"><svg class="ui-icon"><use href="#i-plus"/></svg> NOVA VENDA <svg class="ui-icon"><use href="#i-arrow"/></svg></button><div class="nav-group"><small>VISÃO GERAL</small><button class="nav active" data-view="dashboard"><span class="nav-icon"><svg class="ui-icon"><use href="#i-home"/></svg></span> Visão geral</button><button class="nav" data-view="sale"><span class="nav-icon"><svg class="ui-icon"><use href="#i-cart"/></svg></span> Frente de caixa</button><button class="nav" data-view="sales"><span class="nav-icon"><svg class="ui-icon"><use href="#i-sales"/></svg></span> Vendas</button></div><div class="nav-group"><small>GESTÃO COMERCIAL</small><button class="nav" data-view="clients"><span class="nav-icon"><svg class="ui-icon"><use href="#i-users"/></svg></span> Clientes</button><button class="nav" data-view="receivables"><span class="nav-icon"><svg class="ui-icon"><use href="#i-arrow"/></svg></span> Receber fiado</button><button class="nav" data-view="products"><span class="nav-icon"><svg class="ui-icon"><use href="#i-box"/></svg></span> Produtos</button><button class="nav" data-view="payables"><span class="nav-icon"><svg class="ui-icon"><use href="#i-file"/></svg></span> Contas a pagar</button></div><div class="sidebar-bottom"><span class="avatar">SL</span><span><b>Star Limp</b></span></div></aside><main><header><div><strong id="head-title">Painel operacional</strong><p>Atalhos para atender sem parar</p></div><span class="avatar">JL</span></header><div id="app"></div></main></div><template id="dashboard"><section class="page dashboard-page"><div class="welcome"><div><span class="eyebrow">PAINEL DE CONTROLE</span><h1>Visão geral do negócio</h1><p>Vendas, produtos e financeiro em um só lugar.</p></div><button class="date-pill" type="button">● Sistema online</button></div><section class="hero"><article class="sell-card"><div><span class="sell-tag">● ACESSO RÁPIDO AO PDV</span><h2>Pronto para vender?</h2><p>Abra o caixa e registre sua próxima venda em poucos cliques.</p></div><button class="btn-white" data-go="sale"><svg class="ui-icon"><use href="#i-plus"/></svg> INICIAR NOVA VENDA <svg class="ui-icon"><use href="#i-arrow"/></svg></button></article><article class="shortcuts"><h2>Acesso rápido</h2><p>Operações que você mais utiliza.</p><button class="quick-item" data-go="products"><span class="quick-icon"><svg class="ui-icon"><use href="#i-box"/></svg></span><div><b>Produtos</b><small>Cadastro e preços</small></div><i><svg class="ui-icon"><use href="#i-arrow"/></svg></i></button><button class="quick-item" data-go="clients"><span class="quick-icon"><svg class="ui-icon"><use href="#i-users"/></svg></span><div><b>Clientes</b><small>Cadastro e consulta</small></div><i><svg class="ui-icon"><use href="#i-arrow"/></svg></i></button><button class="quick-item" data-go="payables"><span class="quick-icon"><svg class="ui-icon"><use href="#i-file"/></svg></span><div><b>Contas a pagar</b><small>Boletos e baixas</small></div><i><svg class="ui-icon"><use href="#i-arrow"/></svg></i></button></article></section><div class="heading-row"><div><h2>Indicadores comerciais</h2><p>Resumo atualizado das operações.</p></div></div><section class="stats"><article class="stat"><span>Vendas de hoje</span><strong id="today">R$ 0,00</strong><small>Movimentação do dia</small></article><article class="stat"><span>Vendas da semana</span><strong id="week">R$ 0,00</strong><small>Consolidado semanal</small></article><article class="stat"><span>Valores a receber</span><strong id="receivable">R$ 0,00</strong><small id="debtors">0 cliente(s) com saldo</small></article></section><section class="dashboard-grid"><article class="panel"><h2>Frente de caixa</h2><p class="text">Busque produtos por código ou por qualquer trecho do nome, escolha a forma de pagamento e imprima o pedido ou recibo.</p><button class="primary" data-go="sale">Abrir PDV</button></article><article class="panel"><h2>Operação rápida</h2><p class="text">Cadastre itens, consulte clientes e acompanhe os boletos a pagar.</p><div class="inline-actions"><button class="secondary" data-go="products">Produtos</button><button class="secondary" data-go="clients">Clientes</button></div></article></section></section></template><template id="sales"><section class="page"><div class="welcome"><div><span class="eyebrow">HISTÓRICO OPERACIONAL</span><h1>Vendas</h1><p>Revise pagamentos, imprima e cancele vendas quando necessário.</p></div><button class="primary" data-go="sale">+ Nova venda</button></div><input id="sales-search" class="search" placeholder="Buscar por número, cliente ou forma de pagamento"><section class="panel table-panel"><table><thead><tr><th>#</th><th>Data</th><th>Cliente</th><th>Pagamento</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="sales-rows"></tbody></table><p class="empty" id="empty-sales"></p></section></section></template><template id="receivables"><section class="page"><div class="welcome"><div><span class="eyebrow">FINANCEIRO</span><h1>Receber fiado</h1><p>Baixe os pagamentos dos clientes e mantenha os saldos atualizados.</p></div></div><section class="panel receive-form"><h2>Registrar recebimento</h2><div class="form-grid"><label class="wide">Cliente<select id="receive-client"><option value="">Selecione o cliente</option></select></label><label>Valor recebido (R$)<input id="receive-value" type="number" min="0.01" step="0.01"></label><label>Forma de recebimento<select id="receive-method"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="debito">Débito</option><option value="credito">Crédito</option><option value="transferencia">Transferência</option></select></label><label class="wide">Observação<input id="receive-note" placeholder="Opcional"></label></div><div class="dialog-actions"><button class="success" id="save-receivable" type="button">Registrar baixa</button></div></section><section class="panel table-panel"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Saldo em aberto</th><th></th></tr></thead><tbody id="receivable-rows"></tbody></table><p class="empty" id="empty-receivables"></p></section></section></template><template id="clients"><section class="page"><div class="welcome"><div><span class="eyebrow">GESTÃO COMERCIAL</span><h1>Clientes</h1><p>Consulte pelo nome, telefone ou parte do cadastro.</p></div><button class="primary" id="new-client" type="button">+ Novo cliente</button></div><input id="client-search" class="search" placeholder="Buscar cliente por nome ou telefone"><section class="panel table-panel"><table><thead><tr><th>Cliente</th><th>Telefone</th><th>Saldo em aberto</th></tr></thead><tbody id="client-rows"></tbody></table><p class="empty" id="empty-clients"></p></section></section></template><template id="payables"><section class="page"><div class="welcome"><div><h1>Contas a pagar</h1><p>Importe boletos, acompanhe vencimentos e registre cada baixa.</p></div><button class="primary" id="new-payable" type="button">+ Importar boleto</button></div><section class="payable-metrics"><article class="panel"><span>Em aberto</span><strong id="payable-pending">R$ 0,00</strong><small id="payable-pending-count"></small></article><article class="panel"><span>Pagamentos no mês</span><strong id="payable-paid-month">R$ 0,00</strong><small id="payable-paid-count"></small></article></section><section class="panel table-panel"><table><thead><tr><th>Vencimento</th><th>Fornecedor / descrição</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody id="payable-rows"></tbody></table><p class="empty" id="empty-payables"></p></section></section></template><template id="products"><section class="page"><div class="welcome"><div><h1>Produtos</h1><p>Cadastre, altere valores e acompanhe o estoque.</p></div><button class="primary" id="new-product">+ Novo produto</button></div><input id="product-search" class="search" placeholder="Buscar por produto ou código"><section class="panel table-panel"><table><thead><tr><th>Produto</th><th>Código</th><th>Estoque</th><th>Preço</th><th></th></tr></thead><tbody id="product-rows"></tbody></table><p class="empty" id="empty-products"></p></section></section></template><template id="sale"><section class="page"><div class="welcome"><div><h1>Nova venda</h1><p>Atendimento rápido de balcão.</p></div><button class="secondary" data-go="dashboard">← Painel</button></div><section class="sale-grid"><article class="panel"><h2>Produtos</h2><input id="sale-search" class="search" placeholder="Buscar produto"><div id="suggestions"></div><div class="quantity"><label>Quantidade <input id="quantity" type="number" min="1" value="1"></label><button class="primary" id="add-item">Adicionar</button></div><h2>Itens da venda</h2><div id="cart" class="cart empty">Nenhum produto adicionado.</div></article><aside class="panel total-panel"><span>Total da venda</span><strong id="sale-total">R$ 0,00</strong><label>Pagamento<select id="payment"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="debito">Débito</option><option value="credito">Crédito</option><option value="fiado">Fiado</option></select></label><section id="credit-client" class="credit-client"><label>Cliente (opcional) para notinha ou fiado<input id="credit-client-search" class="search" placeholder="Nome, telefone, CPF ou CNPJ"></label><div id="credit-client-suggestions"></div><button type="button" class="secondary" id="quick-client">+ Cadastrar cliente rapidamente</button></section><button class="success" id="finish-sale">Finalizar venda</button><p class="print-note">Após concluir, você poderá imprimir o pedido ou recibo na Atomo.</p></aside></section></section></template><dialog id="sale-edit-dialog"><form method="dialog"><div class="dialog-head"><h2>Editar venda</h2><button type="submit" formnovalidate aria-label="Fechar">×</button></div><p class="text" id="sale-edit-title"></p><div class="form-grid"><label class="wide">Forma de pagamento<select id="sale-edit-payment"><option value="pix">Pix</option><option value="dinheiro">Dinheiro</option><option value="debito">Débito</option><option value="credito">Crédito</option><option value="fiado">Fiado</option></select></label></div><div class="dialog-actions"><button class="secondary" type="submit" formnovalidate>Cancelar</button><button class="primary" id="save-sale-edit" value="default">Salvar alteração</button></div></form></dialog><dialog id="client-dialog"><form method="dialog"><div class="dialog-head"><h2>Novo cliente</h2><button type="submit" formnovalidate aria-label="Fechar">×</button></div><div class="form-grid"><label class="wide">Nome<input id="c-name" required></label><label>Telefone<input id="c-phone" inputmode="tel"></label><label>CPF ou CNPJ<input id="c-document" inputmode="numeric"></label></div><div class="dialog-actions"><button class="secondary" type="submit" formnovalidate>Cancelar</button><button class="primary" id="save-client" value="default">Salvar cliente</button></div></form></dialog><dialog id="payable-dialog"><form method="dialog"><div class="dialog-head"><h2>Importar boleto</h2><button type="submit" formnovalidate aria-label="Fechar">×</button></div><p class="text">Envie o PDF para preencher os campos automaticamente. Confira os dados antes de salvar.</p><label class="file-field">Arquivo PDF<input id="boleto-file" type="file" accept="application/pdf"><span id="boleto-file-name">Selecionar boleto em PDF</span></label><div class="form-grid"><label class="wide">Fornecedor / beneficiário<input id="p-supplier" placeholder="Nome do fornecedor"></label><label class="wide">Descrição<input id="p-description" value="Boleto importado"></label><label class="wide">Linha digitável<input id="p-line" inputmode="numeric" placeholder="Código de barras ou linha digitável"></label><label>Valor (R$)<input id="p-value" type="number" min="0.01" step="0.01" required></label><label>Vencimento<input id="p-due" type="date"></label></div><p class="print-note" id="pdf-status"></p><div id="installments-preview" class="installments-preview"></div><div class="dialog-actions"><button class="secondary" id="add-installment" type="button">+ Adicionar parcela</button><button class="secondary" type="submit" formnovalidate>Cancelar</button><button class="primary" id="save-payable" value="default">Cadastrar conta(s)</button></div></form></dialog><dialog id="settlement-dialog"><form method="dialog"><div class="dialog-head"><h2>Baixar conta</h2><button type="submit" formnovalidate aria-label="Fechar">×</button></div><p class="text" id="settlement-title"></p><div class="form-grid"><label>Banco / pagamento<select id="s-bank"><option value="">Selecionar</option><option>Caixa</option><option>Banco do Brasil</option><option>Bradesco</option><option>Itaú</option><option>Santander</option><option>Inter</option><option>Nubank</option><option>Pix</option><option>Dinheiro</option><option>Outro</option></select></label><label>Valor pago (R$)<input id="s-value" type="number" min="0.01" step="0.01" required></label><label>Data de pagamento<input id="s-date" type="date" required></label><label>Observação<input id="s-note" placeholder="Opcional"></label></div><div class="dialog-actions"><button class="secondary" type="submit" formnovalidate>Cancelar</button><button class="success" id="save-settlement" value="default">Confirmar baixa</button></div></form></dialog><dialog id="product-dialog"><form method="dialog"><div class="dialog-head"><h2 id="dialog-title">Novo produto</h2><button type="submit" formnovalidate aria-label="Fechar">×</button></div><div class="form-grid"><label>Código<input id="f-code"></label><label>Unidade<input id="f-unit" value="UN"></label><label class="wide">Descrição<input id="f-description" required></label><label>Preço<input id="f-price" type="number" min="0" step="0.01" required></label><label>Estoque<input id="f-stock" type="number" min="0" step="0.01" value="0"></label><label>Categoria<input id="f-category"></label><label>Situação<select id="f-status"><option>Ativo</option><option>Inativo</option></select></label></div><div class="dialog-actions"><button class="secondary" type="submit" formnovalidate>Cancelar</button><button class="primary" id="save-product" value="default">Salvar</button></div></form></dialog><dialog id="receipt-dialog"><form method="dialog" class="receipt-choice"><h2>Venda concluída</h2><p id="receipt-message"></p><button class="primary" id="print-receipt" value="default">Imprimir recibo térmico</button><button class="secondary" id="print-order" value="default">Abrir pedido completo</button><button class="secondary" id="send-whatsapp" value="default" hidden>Enviar notinha no WhatsApp</button><button class="link">Fechar</button></form></dialog><script src="/app.js"></script></body></html>
