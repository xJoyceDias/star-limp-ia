<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Venda - STL Business</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, rgba(22, 131, 255, 0.20), transparent 34%),
        linear-gradient(180deg, #020617 0%, #050b14 100%);
    color: #f8fafc;
    padding: 22px;
}

.app {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding-bottom: 100px;
}

.header {
    margin-bottom: 22px;
}

.back-link {
    color: #7d94b2;
    text-decoration: none;
    font-size: 14px;
}

.page-title {
    margin-top: 18px;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -1px;
}

.page-subtitle {
    margin-top: 6px;
    color: #7d94b2;
    font-size: 14px;
}

.card {
    background: rgba(10, 17, 28, 0.94);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow:
        0 24px 50px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.section-label {
    font-size: 15px;
    font-weight: 900;
    color: #e5edf7;
    margin-bottom: 14px;
}

label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    margin: 12px 0 7px;
}

input, select {
    width: 100%;
    padding: 15px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
    background: #0b1320;
    color: #f8fafc;
    font-size: 16px;
    outline: none;
}

input::placeholder {
    color: #52677f;
}

input:focus, select:focus {
    border-color: rgba(22,131,255,.55);
    box-shadow: 0 0 0 3px rgba(22,131,255,.12);
}

button, .button-link {
    width: 100%;
    padding: 16px;
    margin-top: 14px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #1683ff, #0b65d8);
    color: white;
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
    box-shadow: 0 18px 35px rgba(22,131,255,.24);
}

.button-secondary {
    background: #0b1320;
    border: 1px solid rgba(255,255,255,.08);
    color: #94a3b8;
    box-shadow: none;
}

.sugestao {
    padding: 14px;
    margin-top: 10px;
    background: #0b1320;
    border: 1px solid rgba(22,131,255,.18);
    border-radius: 18px;
    cursor: pointer;
}

.sugestao strong {
    color: #f8fafc;
}

.sugestao span {
    color: #1683ff;
    display: block;
    margin-top: 4px;
    font-weight: 800;
}

.itens-venda {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.item {
    padding: 14px;
    background: #0b1320;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 18px;
    font-size: 14px;
    color: #d8e7f3;
}

.empty {
    color: #7d94b2;
    font-size: 14px;
    text-align: center;
    padding: 12px 0;
}

.total-card {
    background:
        radial-gradient(circle at top left, rgba(22,131,255,.28), transparent 38%),
        linear-gradient(180deg, #0e1d32, #0a111d);
    border-color: rgba(22,131,255,.25);
}

.total-label {
    color: #94a3b8;
    font-size: 14px;
}

.total {
    margin-top: 8px;
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -1.5px;
}

.hidden-fields {
    display: none;
    margin-top: 14px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,.07);
}

.bottom-nav {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    width: calc(100% - 36px);
    max-width: 760px;
    background: rgba(10, 17, 28, 0.94);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 10px;
    box-shadow: 0 20px 45px rgba(0,0,0,.45);
}

.nav-item {
    text-decoration: none;
    color: #7d94b2;
    text-align: center;
    font-size: 11px;
}

.nav-icon {
    display: block;
    font-size: 18px;
    margin-bottom: 3px;
}

.nav-item.active {
    color: #1683ff;
}

@media (min-width: 720px) {
    .grid {
        display: grid;
        grid-template-columns: 1.1fr .9fr;
        gap: 16px;
        align-items: start;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <a href="/" class="back-link">← Voltar ao painel</a>

        <div class="page-title">
            Nova Venda
        </div>

        <div class="page-subtitle">
            Registre produtos, forma de pagamento e conta cliente.
        </div>
    </header>

    <div class="grid">

        <div>

            <section class="card">
                <div class="section-label">Produto</div>

                <label>Buscar produto</label>
                <input type="text" id="produto" placeholder="Ex: fresh 250g" oninput="buscarProdutos()">

                <div id="sugestoes"></div>
                <input type="hidden" id="produtoSelecionado">

                <label>Quantidade</label>
                <input type="number" id="quantidade" value="1">

                <label>Desconto no item (R$)</label>
                <input type="number" id="descontoItem" value="0" min="0" step="0.01">

                <button onclick="adicionarProduto()">
                    Adicionar produto
                </button>
            </section>

            <section class="card">
                <div class="section-label">Itens da venda</div>

                <div id="itensVenda" class="itens-venda">
                    <div class="empty">Nenhum produto adicionado ainda.</div>
                </div>
            </section>

        </div>

        <div>

            <section class="card total-card">
                <div class="total-label">Total da venda</div>

                <div class="total" id="totalVenda">
                    R$ 0,00
                </div>
            </section>

            <section class="card">
                <div class="section-label">Pagamento</div>

                <label>Forma de pagamento</label>
                <select id="formaPagamento" onchange="mostrarCamposCliente()">
                    <option value="pix">Pix</option>
                    <option value="dinheiro">Dinheiro</option>
                    <option value="debito">Débito</option>
                    <option value="credito">Crédito</option>
                    <option value="fiado">Conta Cliente</option>
                </select>

                <div id="dadosContaCliente" class="hidden-fields">
                    <label>Nome do cliente</label>
                    <input type="text" id="clienteNome" placeholder="Ex: João Silva">

                    <label>Telefone / WhatsApp</label>
                    <input type="text" id="clienteTelefone" placeholder="Ex: 62999999999">

                    <label>Retirado por</label>
                    <input type="text" id="retiradoPor" placeholder="Ex: Maria">
                </div>

                <button onclick="finalizarVenda()">
                    Finalizar venda
                </button>
            </section>

            <a class="button-link button-secondary" href="/">
                Voltar
            </a>

        </div>

    </div>

</div>

<nav class="bottom-nav">
    <a class="nav-item" href="/">
        <span class="nav-icon">⌂</span>
        Home
    </a>

    <a class="nav-item active" href="/nova-venda">
        <span class="nav-icon">＋</span>
        Venda
    </a>

    <a class="nav-item" href="/clientes">
        <span class="nav-icon">◉</span>
        Clientes
    </a>

    <a class="nav-item" href="/receber-pagamento">
        <span class="nav-icon">R$</span>
        Receber
    </a>
</nav>

<script>
let carrinho = [];
let total = 0;

function formatarMoeda(valor) {
    return Number(valor || 0).toFixed(2).replace(".", ",");
}

function mostrarCamposCliente() {
    const formaPagamento = document.getElementById("formaPagamento").value;
    const dadosContaCliente = document.getElementById("dadosContaCliente");

    if (formaPagamento === "fiado") {
        dadosContaCliente.style.display = "block";
    } else {
        dadosContaCliente.style.display = "none";
    }
}

async function buscarProdutos() {
    const termo = document.getElementById("produto").value.trim();
    const sugestoes = document.getElementById("sugestoes");

    if (termo.length < 2) {
        sugestoes.innerHTML = "";
        return;
    }

    try {
        const resposta = await fetch(`/buscar-produtos?termo=${encodeURIComponent(termo)}`);
        const produtos = await resposta.json();

        sugestoes.innerHTML = "";

        if (produtos.length === 0) {
            sugestoes.innerHTML = `<div class="sugestao">Nenhum produto encontrado.</div>`;
            return;
        }

        produtos.forEach(produto => {
            const div = document.createElement("div");
            div.className = "sugestao";

            div.innerHTML = `
                <strong>${produto.descricao}</strong>
                <span>R$ ${formatarMoeda(produto.preco)}</span>
            `;

            div.onclick = () => {
                document.getElementById("produto").value = produto.descricao;
                document.getElementById("produtoSelecionado").value = JSON.stringify(produto);
                sugestoes.innerHTML = "";
            };

            sugestoes.appendChild(div);
        });

    } catch (erro) {
        console.error("Erro ao buscar produtos:", erro);
        sugestoes.innerHTML = `<div class="sugestao">Erro ao buscar produtos.</div>`;
    }
}

function adicionarProduto() {
    const produtoJson = document.getElementById("produtoSelecionado").value;

    if (!produtoJson) {
        alert("Selecione um produto.");
        return;
    }

    const produto = JSON.parse(produtoJson);
    const quantidade = parseFloat(document.getElementById("quantidade").value);
    const desconto = parseFloat(document.getElementById("descontoItem").value) || 0;

    if (!quantidade || quantidade <= 0) {
        alert("Informe uma quantidade válida.");
        return;
    }

    if (desconto < 0) {
        alert("O desconto não pode ser negativo.");
        return;
    }

    const valorBruto = produto.preco * quantidade;

    if (desconto > valorBruto) {
        alert("O desconto não pode ser maior que o valor do item.");
        return;
    }

    const subtotal = valorBruto - desconto;

    carrinho.push({
        codigo: produto.codigo,
        produto: produto.descricao,
        quantidade: quantidade,
        preco: produto.preco,
        desconto: desconto,
        subtotal: subtotal
    });

    atualizarCarrinho();

    document.getElementById("produto").value = "";
    document.getElementById("produtoSelecionado").value = "";
    document.getElementById("quantidade").value = "1";
    document.getElementById("descontoItem").value = "0";
    document.getElementById("sugestoes").innerHTML = "";
}

function atualizarCarrinho() {
    const itensVenda = document.getElementById("itensVenda");

    itensVenda.innerHTML = "";
    total = 0;

    if (carrinho.length === 0) {
        itensVenda.innerHTML = `<div class="empty">Nenhum produto adicionado ainda.</div>`;
    }

    carrinho.forEach((item, index) => {
        total += item.subtotal;

        const div = document.createElement("div");
        div.className = "item";

        let descontoTexto = "";

        if (item.desconto && item.desconto > 0) {
            descontoTexto = `<br>Desconto: R$ ${formatarMoeda(item.desconto)}`;
        }

        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                <div style="flex:1;">
                    ${item.quantidade}x ${item.produto}
                    <br>
                    Unitário: R$ ${formatarMoeda(item.preco)}
                    ${descontoTexto}
                    <br>
                    <strong>Subtotal: R$ ${formatarMoeda(item.subtotal)}</strong>
                </div>

                <button
                    onclick="removerItem(${index})"
                    style="
                        width:38px;
                        height:38px;
                        border-radius:12px;
                        background:#7f1d1d;
                        border:none;
                        color:white;
                        cursor:pointer;
                        font-size:16px;
                        margin:0;
                        padding:0;
                        flex-shrink:0;
                        box-shadow:none;
                    "
                >
                    🗑️
                </button>
            </div>
        `;

        itensVenda.appendChild(div);
    });

    document.getElementById("totalVenda").innerHTML =
        `R$ ${formatarMoeda(total)}`;
}

function removerItem(index) {
    const confirmar = confirm("Deseja remover este produto da venda?");

    if (!confirmar) {
        return;
    }

    carrinho.splice(index, 1);
    atualizarCarrinho();
}

async function finalizarVenda() {
    if (carrinho.length === 0) {
        alert("Adicione pelo menos um produto.");
        return;
    }

    const formaPagamento = document.getElementById("formaPagamento").value;

    try {
        const resposta = await fetch("/finalizar-venda", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                itens: carrinho,
                total: total,
                forma_pagamento: formaPagamento,
                cliente_nome: document.getElementById("clienteNome").value,
                cliente_telefone: document.getElementById("clienteTelefone").value,
                retirado_por: document.getElementById("retiradoPor").value
            })
        });

        const resultado = await resposta.json();

        if (!resultado.sucesso) {
            alert(resultado.mensagem);
            return;
        }

        alert(resultado.mensagem);

        if (resultado.telefone_whatsapp && resultado.mensagem_whatsapp) {
            const telefone = resultado.telefone_whatsapp.replace(/\D/g, "");
            const mensagem = encodeURIComponent(resultado.mensagem_whatsapp);
            window.open(`https://wa.me/55${telefone}?text=${mensagem}`, "_blank");
        }

        setTimeout(() => {
            window.location.href = "/nova-venda";
        }, 800);
    } catch (erro) {
        alert("Erro ao finalizar venda:\n\n" + erro);
    }
}
</script>
</body>
</html>
