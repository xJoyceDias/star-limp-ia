<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produtos e preços · Star Limp</title>
<style>
:root{--nav:#101c2c;--blue:#2879e4;--bg:#f4f7fa;--ink:#19283b;--muted:#76879a;--line:#dfe7ee;--green:#18ad7c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.top{height:68px;padding:0 5%;display:flex;align-items:center;gap:20px;background:#fff;border-bottom:1px solid var(--line)}.brand{font-weight:850;letter-spacing:-1px;font-size:19px}.brand b{display:inline-grid;place-items:center;width:27px;height:27px;margin-right:8px;border-radius:8px 8px 8px 2px;background:var(--blue);color:#fff;transform:rotate(-12deg)}.brand i{font-style:normal;display:block;transform:rotate(12deg)}.back{color:#5d7187;text-decoration:none;font-size:13px;font-weight:700}.content{max-width:1120px;margin:auto;padding:34px 24px 55px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}h1{margin:0;font-size:30px;letter-spacing:-1.5px}.heading p{margin:6px 0 0;color:var(--muted);font-size:13px}.button{border:0;border-radius:10px;padding:12px 15px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.toolbar{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;max-width:450px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.panel{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 10px 24px #233b5110}table{width:100%;border-collapse:collapse}th{padding:14px 16px;color:#8998a7;background:#fbfcfd;text-align:left;font-size:10px;letter-spacing:.7px;text-transform:uppercase}td{padding:15px 16px;border-top:1px solid #edf1f4;font-size:13px}td:first-child{font-weight:800}.stock-low{color:#c87825;font-weight:800}.tag{padding:4px 7px;border-radius:20px;background:#e6f7ef;color:#16855f;font-size:10px;font-weight:800}.edit{border:1px solid #d6e3f0;border-radius:7px;padding:7px 9px;background:#f2f7ff;color:#286fca;font-size:11px;font-weight:800;cursor:pointer}.empty{padding:36px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#10203382}.modal.open{display:grid}.dialog{width:min(600px,100%);padding:24px;border-radius:16px;background:#fff;box-shadow:0 25px 60px #11233a40}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialog h2{margin:0;font-size:19px}.close{border:0;background:transparent;color:#6d7e90;font-size:24px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}label{display:block;margin-bottom:5px;color:#607289;font-size:11px;font-weight:800}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.secondary{border:1px solid var(--line);border-radius:9px;padding:10px 13px;background:#fff;color:#596d83;font-weight:800;cursor:pointer}.notice{position:fixed;right:22px;bottom:22px;padding:12px 15px;border-radius:10px;background:#17283e;color:#fff;font-size:12px;font-weight:750;opacity:0;transform:translateY(15px);transition:.2s}.notice.show{opacity:1;transform:translateY(0)}@media(max-width:600px){.top{padding:0 18px}.content{padding:24px 16px}.heading{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}th:nth-child(2),td:nth-child(2),th:nth-child(5),td:nth-child(5){display:none}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b><i>✦</i></b>star limp</div><a class="back" href="/">← Voltar ao painel</a></header>
<main class="content"><div class="heading"><div><h1>Produtos e preços</h1><p>Cadastre, atualize valores e acompanhe o estoque do seu PDV.</p></div><button class="button" onclick="abrirNovo()">+ Novo produto</button></div><div class="toolbar"><input class="search" id="busca" oninput="carregar()" placeholder="Buscar por produto ou código"></div><section class="panel"><table><thead><tr><th>Produto</th><th>Código</th><th>Categoria</th><th>Estoque</th><th>Preço de venda</th><th></th></tr></thead><tbody id="linhas"></tbody></table><div id="vazio" class="empty" hidden>Nenhum produto encontrado.</div></section></main>
<div class="modal" id="modal"><form class="dialog" onsubmit="salvar(event)"><div class="dialog-head"><h2 id="tituloModal">Novo produto</h2><button type="button" class="close" onclick="fechar()">×</button></div><div class="grid"><div class="field"><label>Código</label><input id="codigo"></div><div class="field"><label>Unidade</label><input id="unidade" value="UN"></div><div class="field full"><label>Descrição *</label><input id="descricao" required></div><div class="field"><label>Preço de venda *</label><input id="preco" type="number" min="0" step="0.01" required></div><div class="field"><label>Estoque</label><input id="estoque" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Categoria</label><input id="categoria"></div><div class="field"><label>Situação</label><select id="situacao"><option>Ativo</option><option>Inativo</option></select></div></div><div class="actions"><button class="secondary" type="button" onclick="fechar()">Cancelar</button><button class="button">Salvar produto</button></div></form></div><div class="notice" id="notice"></div>
<script>
let produtos=[],editando=null,timer;const el=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function aviso(m){el('notice').textContent=m;el('notice').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el('notice').classList.remove('show'),2600)}
async function carregar(){const r=await fetch('/api/produtos?termo='+encodeURIComponent(el('busca').value));produtos=await r.json();const linhas=el('linhas');linhas.innerHTML=produtos.map(p=>'<tr><td>'+esc(p.descricao)+'</td><td>'+esc(p.codigo||'—')+'</td><td>'+esc(p.categoria||'—')+'</td><td class="'+(Number(p.estoque||0)<=5?'stock-low':'')+'">'+Number(p.estoque||0)+' '+esc(p.unidade||'UN')+'</td><td>'+money(p.preco)+'</td><td><button class="edit" onclick="editar('+p.id+')">Editar</button></td></tr>').join('');el('vazio').hidden=produtos.length>0}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function abrirNovo(){editando=null;el('tituloModal').textContent='Novo produto';['codigo','descricao','categoria'].forEach(id=>el(id).value='');el('unidade').value='UN';el('preco').value='';el('estoque').value='0';el('situacao').value='Ativo';el('modal').classList.add('open')}
function editar(id){const p=produtos.find(x=>x.id===id);if(!p)return;editando=id;el('tituloModal').textContent='Editar produto';['codigo','descricao','unidade','preco','estoque','categoria','situacao'].forEach(k=>el(k).value=p[k]??'');el('modal').classList.add('open')}
function fechar(){el('modal').classList.remove('open')}
async function salvar(e){e.preventDefault();const dados=Object.fromEntries(['codigo','descricao','unidade','preco','estoque','categoria','situacao'].map(k=>[k,el(k).value]));const url=editando?'/api/produtos/'+editando:'/api/produtos';const r=await fetch(url,{method:editando?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});const d=await r.json();if(!d.sucesso){aviso(d.mensagem||'Não foi possível salvar');return}fechar();aviso(d.mensagem);carregar()}
carregar();
</script></body></html>
